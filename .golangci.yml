version: "2"

run:
  timeout: 5m

linters:
  default: standard

  enable:
    - nlreturn
    - gocritic
    - gocyclo
    - revive
    - goconst
    - unparam
    - misspell
    - lll
    - funlen
    - gocognit

  settings:
    funlen:
      lines: 40
      statements: 30

    gocognit:
      min-complexity: 15

    nlreturn:
      block-size: 3

    lll:
      line-length: 120
      tab-width: 1

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - funlen
          - gocognit
          - goconst

formatters:
  enable:
    - gofmt
    - gci

  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(code)